<svg
  width="620"
  height="260"
  viewBox="0 0 620 260"
  xmlns="http://www.w3.org/2000/svg"
>

  <rect
    width="620"
    height="260"
    rx="14"
    fill="#0d1117"
    stroke="#21262d"
    stroke-width="1"
  />

  <!-- Profile Header -->
  <g transform="translate(24,24)">

    <circle
      cx="16"
      cy="16"
      r="16"
      fill="#2F8D46"
    />

    <text
      x="16"
      y="21"
      text-anchor="middle"
      font-family="Segoe UI, sans-serif"
      font-size="14"
      font-weight="bold"
      fill="#ffffff"
    >
      R
    </text>

    <text
      x="42"
      y="12"
      font-family="Segoe UI, sans-serif"
      font-size="18"
      font-weight="700"
      fill="#e6edf3"
    >
      Rahul Yadav
    </text>

    <text
      x="42"
      y="30"
      font-family="Segoe UI, sans-serif"
      font-size="12"
      fill="#8b949e"
    >
      GeeksforGeeks Profile
    </text>

  </g>

  <line
    x1="24"
    y1="66"
    x2="596"
    y2="66"
    stroke="#21262d"
    stroke-width="1"
  />

  <!-- Progress Ring -->
  <g transform="translate(140,175)">

    <circle
      r="82"
      fill="none"
      stroke="#21262d"
      stroke-width="18"
    />

    <!-- Easy -->
    <circle
      r="82"
      fill="none"
      stroke="#4caf50"
      stroke-width="18"
      stroke-dasharray="154.56 515.2"
      transform="rotate(-90)"
    />

    <!-- Medium -->
    <circle
      r="82"
      fill="none"
      stroke="#f5a623"
      stroke-width="18"
      stroke-dasharray="12.880000000000003 515.2"
      stroke-dashoffset="-154.56"
      transform="rotate(-90)"
    />

    <!-- Hard -->
    <circle
      r="82"
      fill="none"
      stroke="#ef4743"
      stroke-width="18"
      stroke-dasharray="0 515.2"
      stroke-dashoffset="-167.44"
      transform="rotate(-90)"
    />

    <text
      x="0"
      y="-6"
      text-anchor="middle"
      font-family="Segoe UI, sans-serif"
      font-size="38"
      font-weight="800"
      fill="#ffffff"
    >
      80
    </text>

    <text
      x="0"
      y="20"
      text-anchor="middle"
      font-family="Segoe UI, sans-serif"
      font-size="13"
      fill="#8b949e"
    >
      Problems Solved
    </text>

  </g>

  <!-- Statistics -->
  <g
    transform="translate(320,100)"
    font-family="Segoe UI, sans-serif"
    font-size="15"
    fill="#c9d1d9"
  >

    <rect
      x="0"
      y="0"
      width="10"
      height="10"
      rx="2"
      fill="#4caf50"
    />

    <text x="18" y="10">
      Easy (24)
    </text>


    <rect
      x="0"
      y="40"
      width="10"
      height="10"
      rx="2"
      fill="#f5a623"
    />

    <text x="18" y="50">
      Medium (2)
    </text>


    <rect
      x="0"
      y="80"
      width="10"
      height="10"
      rx="2"
      fill="#ef4743"
    />

    <text x="18" y="90">
      Hard (0)
    </text>


    <rect
      x="0"
      y="120"
      width="10"
      height="10"
      rx="2"
      fill="#2F8D46"
    />

    <text x="18" y="130">
      Total (80)
    </text>

  </g>

  <text
    x="596"
    y="248"
    text-anchor="end"
    font-family="Segoe UI, sans-serif"
    font-size="10"
    fill="#484f58"
  >
    Updated 2026-08-25
  </text>

</svg>